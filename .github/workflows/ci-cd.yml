name: CI/CD для Kafka System Control 4.0

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write   # необходимо для создания релизов через GITHUB_TOKEN

env:
  DOCKER_REGISTRY: docker.io
  DOCKER_IMAGE_BACKEND: egorich27/kafka-control-backend
  DOCKER_IMAGE_FRONTEND: egorich27/kafka-control-frontend
  KAFKA_VERSION: 3.5.0
  KAFKA_SCALA_VERSION: 2.13

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # ---- КЭШИРОВАНИЕ АРХИВА KAFKA ДЛЯ BACKEND ----
      - name: Cache Kafka archive for backend
        id: cache-kafka-backend
        uses: actions/cache@v3
        with:
          path: backend/kafka_${{ env.KAFKA_SCALA_VERSION }}-${{ env.KAFKA_VERSION }}.tgz
          key: kafka-${{ env.KAFKA_VERSION }}-backend

      - name: Download Kafka archive if not cached (backend)
        if: steps.cache-kafka-backend.outputs.cache-hit != 'true'
        run: |
          wget -O backend/kafka_${{ env.KAFKA_SCALA_VERSION }}-${{ env.KAFKA_VERSION }}.tgz \
            https://archive.apache.org/dist/kafka/${{ env.KAFKA_VERSION }}/kafka_${{ env.KAFKA_SCALA_VERSION }}-${{ env.KAFKA_VERSION }}.tgz

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ---- BACKEND ----
      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE_BACKEND }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- FRONTEND ----
      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE_FRONTEND }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- СОЗДАНИЕ GITHUB RELEASE (только для тегов) ----
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Kafka System Control ${{ github.ref_name }}
            ✅ **Что внутри:**
            - Docker образы backend и frontend загружены в Docker Hub
            - Тег: `${{ github.ref_name }}`
            🚀 **Как запустить:** см. README
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-to-kubernetes:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install YC CLI and jq
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH
          sudo apt update
          sudo apt install -y jq

      - name: Configure YC and authenticate
        run: |
          export PATH="$HOME/yandex-cloud/bin:$PATH"
          echo "${{ secrets.YC_SA_JSON_KEY_BASE64 }}" | base64 -d > key.json
          yc config set service-account-key key.json
          yc config set folder-id ${{ secrets.YC_FOLDER_ID }}
          yc config set cloud-id ${{ secrets.YC_CLOUD_ID }}
          yc resource-manager folder get ${{ secrets.YC_FOLDER_ID }}

      - name: Get Kubeconfig for cluster
        run: |
          export PATH="$HOME/yandex-cloud/bin:$PATH"
          yc managed-kubernetes cluster get-credentials kafka-system-cluster --external --force
          kubectl cluster-info

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl wait --for=jsonpath='{.status.phase}'=Active namespace/kafka-system --timeout=30s
          kubectl apply -f k8s/
          kubectl rollout status deployment/backend -n kafka-system --timeout=90s
          kubectl rollout status deployment/frontend -n kafka-system --timeout=90s