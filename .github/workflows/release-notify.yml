name: Release Notifier

on:
  workflow_run:
    workflows:
      - "CI/CD для Kafka System Control 4.0"
    types:
      - completed

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')

    steps:
      - name: Checkout release
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Install Russian CA certificates
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates
          sudo update-ca-certificates

      - name: Prepare release information
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -e

          RELEASE_URL="https://github.com/${REPO}/releases/tag/${TAG}"

          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
          echo "RELEASE_URL=${RELEASE_URL}" >> "$GITHUB_OUTPUT"

          echo "=== Release ==="
          echo "Tag: ${TAG}"
          echo "URL: ${RELEASE_URL}"

          PREVIOUS_TAG=$(git tag --sort=-version:refname \
            | grep '^v' \
            | grep -vx "${TAG}" \
            | head -1 || true)

          echo "Previous tag: ${PREVIOUS_TAG:-none}"

          if [ -n "${PREVIOUS_TAG}" ]; then
            COMMITS=$(git log \
              --pretty=format:'- %s' \
              "${PREVIOUS_TAG}..${TAG}")
          else
            COMMITS=$(git log \
              --pretty=format:'- %s' \
              "${TAG}")
          fi

          if [ -z "${COMMITS}" ]; then
            COMMITS="- Изменения не указаны."
          fi

          {
            echo "🚀 **Новый релиз: ${TAG}**"
            echo
            echo "📝 **Что нового:**"
            echo "${COMMITS}"
            echo
            echo "🔗 [Смотреть на GitHub](${RELEASE_URL})"
          } > /tmp/message.txt

          echo "=== Release message ==="
          cat /tmp/message.txt

      - name: Find release screenshot
        id: screenshot
        env:
          TAG: ${{ steps.release.outputs.TAG }}
        run: |
          set -e

          IMG_PATH=$(find docs/screenshots \
            -maxdepth 1 \
            -type f \
            -name "${TAG}-*.png" \
            | sort \
            | head -1 || true)

          if [ -n "${IMG_PATH}" ] && [ -f "${IMG_PATH}" ]; then
            echo "IMAGE_PATH=${IMG_PATH}" >> "$GITHUB_OUTPUT"
            echo "Screenshot found: ${IMG_PATH}"
          else
            echo "No screenshot found for ${TAG}."
          fi

      # ============================================================
      # MAX
      # ============================================================

      - name: Send release notification to MAX
        env:
          MAX_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHAT_ID: ${{ secrets.MAX_CHAT_ID }}
          TAG: ${{ steps.release.outputs.TAG }}
          RELEASE_URL: ${{ steps.release.outputs.RELEASE_URL }}
          IMG_PATH: ${{ steps.screenshot.outputs.IMAGE_PATH }}
        run: |
          set -e

          if [ -z "${MAX_TOKEN}" ]; then
            echo "ERROR: MAX_BOT_TOKEN is not configured."
            exit 1
          fi

          if [ -z "${MAX_CHAT_ID}" ]; then
            echo "ERROR: MAX_CHAT_ID is not configured."
            exit 1
          fi

          CHANGES=$(sed -n '/^📝 \*\*Что нового:\*\*$/,/^🔗 \*\*\[Смотреть на GitHub\]/{ 
            /^📝 \*\*Что нового:\*\*$/d
            /^🔗 \*\*\[Смотреть на GitHub\]/d
            p
          }' /tmp/message.txt)

          if [ -z "${CHANGES}" ]; then
            CHANGES="- Изменения не указаны."
          fi

          printf '**Новый релиз: %s**\n\n📝 **Что нового:**\n%s\n\n🔗 [Смотреть на GitHub](%s)\n' \
            "${TAG}" \
            "${CHANGES}" \
            "${RELEASE_URL}" \
            > /tmp/max-message.txt

          echo "=== MAX MESSAGE ==="
          cat /tmp/max-message.txt

          if [ -n "${IMG_PATH}" ] && [ -f "${IMG_PATH}" ]; then
            echo "Uploading screenshot to MAX..."

            UPLOAD_RESULT=$(curl -k -sS \
              -X POST \
              "https://platform-api2.max.ru/uploads?type=image" \
              -H "Authorization: ${MAX_TOKEN}" \
              -F "data=@${IMG_PATH}")

            echo "=== MAX UPLOAD RESULT ==="
            echo "${UPLOAD_RESULT}"

            PHOTO_ID=$(echo "${UPLOAD_RESULT}" \
              | jq -r '.photos | keys | .[0] // empty')

            PHOTO_TOKEN=$(echo "${UPLOAD_RESULT}" \
              | jq -r '.photos | to_entries | .[0].value.token // empty')

            if [ -z "${PHOTO_ID}" ] || [ -z "${PHOTO_TOKEN}" ]; then
              echo "ERROR: Failed to upload screenshot to MAX."
              exit 1
            fi

            SEND_RESULT=$(jq -n \
              --arg text "$(cat /tmp/max-message.txt)" \
              --arg pid "${PHOTO_ID}" \
              --arg token "${PHOTO_TOKEN}" \
              '{
                text: $text,
                format: "markdown",
                notify: true,
                attachments: [
                  {
                    type: "image",
                    payload: {
                      photo_id: $pid,
                      token: $token
                    }
                  }
                ]
              }' \
              | curl -k -sS \
                -X POST \
                "https://platform-api2.max.ru/messages?chat_id=${MAX_CHAT_ID}" \
                -H "Authorization: ${MAX_TOKEN}" \
                -H "Content-Type: application/json" \
                -d @-)

          else
            echo "No screenshot. Sending text-only notification to MAX."

            SEND_RESULT=$(jq -n \
              --arg text "$(cat /tmp/max-message.txt)" \
              '{
                text: $text,
                format: "markdown",
                notify: true
              }' \
              | curl -k -sS \
                -X POST \
                "https://platform-api2.max.ru/messages?chat_id=${MAX_CHAT_ID}" \
                -H "Authorization: ${MAX_TOKEN}" \
                -H "Content-Type: application/json" \
                -d @-)
          fi

          echo "=== MAX SEND RESULT ==="
          echo "${SEND_RESULT}"

          if ! echo "${SEND_RESULT}" | jq -e '.message' >/dev/null; then
            echo "ERROR: MAX notification failed."
            exit 1
          fi

          echo "MAX notification sent successfully."

      # ============================================================
      # TELEGRAM
      # ============================================================

      - name: Send release notification to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAG: ${{ steps.release.outputs.TAG }}
          RELEASE_URL: ${{ steps.release.outputs.RELEASE_URL }}
          IMG_PATH: ${{ steps.screenshot.outputs.IMAGE_PATH }}
        run: |
          set -e

          if [ -z "${TELEGRAM_BOT_TOKEN}" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN is not configured."
            exit 1
          fi

          if [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "ERROR: TELEGRAM_CHAT_ID is not configured."
            exit 1
          fi

          if [ -n "${IMG_PATH}" ] && [ -f "${IMG_PATH}" ]; then
            echo "Sending screenshot to Telegram..."

            PHOTO_RESULT=$(curl -sS \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "photo=@${IMG_PATH}" \
              -F "caption=Новый релиз: ${TAG}")

            echo "=== TELEGRAM PHOTO RESULT ==="
            echo "${PHOTO_RESULT}"

            if ! echo "${PHOTO_RESULT}" | jq -e '.ok == true' >/dev/null; then
              echo "ERROR: Telegram screenshot notification failed."
              exit 1
            fi

            {
              echo "📝 Описание релиза: ${TAG}"
              echo
              echo "Что нового:"
              sed -n '/^📝 \*\*Что нового:\*\*$/,/^🔗 \*\*\[Смотреть на GitHub\]/{ 
                /^📝 \*\*Что нового:\*\*$/d
                /^🔗 \*\*\[Смотреть на GitHub\]/d
                p
              }' /tmp/message.txt
              echo
              echo "🔗 Смотреть на GitHub: ${RELEASE_URL}"
            } > /tmp/telegram-message.txt

            echo "=== TELEGRAM MESSAGE ==="
            cat /tmp/telegram-message.txt

            MESSAGE_RESULT=$(curl -sS \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=$(cat /tmp/telegram-message.txt)")

            echo "=== TELEGRAM MESSAGE RESULT ==="
            echo "${MESSAGE_RESULT}"

            if ! echo "${MESSAGE_RESULT}" | jq -e '.ok == true' >/dev/null; then
              echo "ERROR: Telegram release description notification failed."
              exit 1
            fi

          else
            echo "No screenshot. Sending single Telegram message."

            TELEGRAM_MESSAGE=$(sed \
              -e 's/^\*\*Новый релиз: /**Новый релиз: /' \
              /tmp/message.txt)

            MESSAGE_RESULT=$(curl -sS \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=$(cat /tmp/message.txt)")

            echo "=== TELEGRAM MESSAGE RESULT ==="
            echo "${MESSAGE_RESULT}"

            if ! echo "${MESSAGE_RESULT}" | jq -e '.ok == true' >/dev/null; then
              echo "ERROR: Telegram notification failed."
              exit 1
            fi
          fi

          echo "Telegram notification sent successfully."