name: MAX Release Notifier

on:
  workflow_run:
    workflows: ["CI/CD для Kafka System Control 4.0"]
    types:
      - completed
  workflow_dispatch:

jobs:
  notify-max:
    runs-on: ubuntu-latest
    if: ${{ (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v')) || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Russian Trusted CA certificates
        continue-on-error: true
        run: |
          sudo wget -q --timeout=10 --tries=2 https://gu-st.ru/content/Other/doc/russian_trusted_root_ca.cer \
            -O /usr/local/share/ca-certificates/russian_trusted_root_ca.crt || true
          sudo wget -q --timeout=10 --tries=2 https://gu-st.ru/content/Other/doc/russian_trusted_sub_ca.cer \
            -O /usr/local/share/ca-certificates/russian_trusted_sub_ca.crt || true
          sudo update-ca-certificates || true

      - name: Build release message
        env:
          TAG: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          REPO: ${{ github.repository }}
          RELEASE_BODY: ${{ github.event.release.body || 'Проверка отправки уведомлений в MAX' }}
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -1)
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi

          CHANGES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges)
          if [ -z "$CHANGES" ]; then
            CHANGES="${RELEASE_BODY}"
          fi

          RELEASE_URL="https://github.com/${REPO}/releases/tag/${TAG}"

          printf '🚀 **Новый релиз: %s**\n\n📝 **Что нового:**\n%s\n\n🔗 [Смотреть на GitHub](%s)\n' \
            "${TAG}" \
            "${CHANGES}" \
            "${RELEASE_URL}" \
            > /tmp/message.txt

          echo "=== MESSAGE TO SEND ==="
          cat /tmp/message.txt
          echo "=== END ==="

      - name: Send message to MAX with image attachment
        env:
          MAX_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHAT_ID: ${{ secrets.MAX_CHAT_ID }}
          TAG: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          MESSAGE=$(cat /tmp/message.txt)

          # Ищем первый скриншот для текущего тега
          IMG_PATH=$(ls docs/screenshots/${TAG}-*.png 2>/dev/null | head -1)

          if [ -n "$IMG_PATH" ]; then
            echo "=== FOUND SCREENSHOT: $IMG_PATH ==="

            # Шаг 1: Получаем URL для загрузки картинки
            UPLOAD_INFO=$(curl -s -X POST "https://platform-api2.max.ru/uploads?type=image" \
              -H "Authorization: ${MAX_TOKEN}")

            echo "=== UPLOAD INFO ==="
            echo "$UPLOAD_INFO"
            echo "=== END UPLOAD INFO ==="

            UPLOAD_URL=$(echo "$UPLOAD_INFO" | jq -r '.url // empty')

            if [ -n "$UPLOAD_URL" ]; then
              # Шаг 2: Загружаем файл
              UPLOAD_RESULT=$(curl -s -X POST "${UPLOAD_URL}" \
                -H "Content-Type: multipart/form-data" \
                -F "data=@${IMG_PATH}")

              echo "=== UPLOAD RESULT ==="
              echo "$UPLOAD_RESULT"
              echo "=== END UPLOAD RESULT ==="

              # ВАЖНО: token и photo_id лежат внутри .photos.<photo_id>.token
              PHOTO_ID=$(echo "$UPLOAD_RESULT" | jq -r '.photos | keys | .[0] // empty')
              PHOTO_TOKEN=$(echo "$UPLOAD_RESULT" | jq -r '.photos | to_entries | .[0].value.token // empty')

              echo "=== PHOTO_ID: $PHOTO_ID ==="
              echo "=== PHOTO_TOKEN: $PHOTO_TOKEN ==="

              if [ -n "$PHOTO_TOKEN" ] && [ -n "$PHOTO_ID" ]; then
                # Шаг 3: Отправляем сообщение с картинкой
                SEND_RESULT=$(curl -s -X POST "https://platform-api2.max.ru/messages?chat_id=${MAX_CHAT_ID}" \
                  -H "Authorization: ${MAX_TOKEN}" \
                  -H "Content-Type: application/json" \
                  -d "$(jq -n \
                    --arg text "$MESSAGE" \
                    --arg token "$PHOTO_TOKEN" \
                    --arg pid "$PHOTO_ID" \
                    '{text: $text, format: "markdown", notify: true,
                      attachments: [{type: "image", payload: {photo_id: $pid, token: $token}}]}')")

                echo "=== SEND RESULT ==="
                echo "$SEND_RESULT"
                echo "=== END SEND RESULT ==="
                exit 0
              fi
            fi
          fi

          # Fallback: если картинки нет — отправляем только текст
          echo "=== NO IMAGE, SENDING TEXT ONLY ==="
          curl -s -X POST "https://platform-api2.max.ru/messages?chat_id=${MAX_CHAT_ID}" \
            -H "Authorization: ${MAX_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg text "$MESSAGE" '{text: $text, format: "markdown", notify: true}')"