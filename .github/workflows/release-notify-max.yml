name: MAX Release Notifier

on:
  # Этот блок заставляет скрипт запускаться автоматически сразу после успешного завершения основного CI/CD
  workflow_run:
    workflows: ["CI/CD для Kafka System Control 4.0"]
    types:
      - completed
  workflow_dispatch:

jobs:
  notify-max:
    runs-on: ubuntu-latest
    # Запускаем отправку только если родительский воркфлоу завершился успешно и это был тег версии
    if: ${{ github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v') || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Russian Trusted CA certificates
        continue-on-error: true
        run: |
          sudo wget -q --timeout=10 --tries=2 https://gu-st.ru \
            -O /usr/local/share/ca-certificates/russian_trusted_root_ca.crt || true
          sudo wget -q --timeout=10 --tries=2 https://gu-st.ru \
            -O /usr/local/share/ca-certificates/russian_trusted_sub_ca.crt || true
          sudo update-ca-certificates || true

      - name: Build release message
        env:
          # Берём имя ветки/тега, которая стриггерила запуск
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          RELEASE_BODY: ${{ github.event.release.body || 'Проверка отправки уведомлений в MAX' }}
          RELEASE_URL: ${{ github.event.release.html_url || format('https://github.com{0}/releases/tag/{1}', github.repository, github.event.workflow_run.head_branch || github.ref_name) }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          SCREENSHOTS=""
          if [ -d "docs/screenshots" ]; then
            for img in docs/screenshots/${TAG}-*.png; do
              if [ -f "$img" ]; then
                FILENAME=$(basename "$img")
                RAW_URL="https://githubusercontent.com{REPO}/${TAG}/${img}"
                SCREENSHOTS="${SCREENSHOTS}\n![${FILENAME}](${RAW_URL})"
              fi
            done
          fi

          # Убрано дублирование в скобках, теперь строка чистая
          MESSAGE="🚀 **Новый релиз: ${RELEASE_TAG}**

          📝 **Что нового:**
          ${RELEASE_BODY}
          ${SCREENSHOTS}

          🔗 [Смотреть на GitHub](${RELEASE_URL})"

          echo "$MESSAGE" > /tmp/message.txt

      - name: Send message to MAX
        env:
          MAX_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHAT_ID: ${{ secrets.MAX_CHAT_ID }}
        run: |
          MESSAGE=$(cat /tmp/message.txt)
          curl -s -X POST "https://max.ru{MAX_CHAT_ID}" \
            -H "Authorization: ${MAX_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg text "$MESSAGE" '{text: $text, format: "markdown", notify: true}')"
