name: Telegram Test Notifier

on:
  workflow_dispatch:

jobs:
  notify-telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build release message
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          printf '🚀 **Новый релиз: %s**\n\n📝 **Что нового:**\n%s\n\n🔗 [Смотреть на GitHub](https://github.com/%s/releases/tag/%s)\n' \
            "${TAG}" \
            "Тестовая отправка в Telegram" \
            "${REPO}" \
            "${TAG}" \
            > /tmp/message.txt

          echo "=== MESSAGE TO SEND ==="
          cat /tmp/message.txt
          echo "=== END ==="

      - name: Send message to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE=$(cat /tmp/message.txt)

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg chat "$TELEGRAM_CHAT_ID" \
              --arg text "$MESSAGE" \
              '{chat_id: $chat, text: $text, parse_mode: "MarkdownV2", disable_web_page_preview: true}')" | jq .