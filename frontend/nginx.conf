server {
    listen 8080;   # был 80, стало 8080
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    location /api {
        proxy_pass http://backend-service:8080/api;
        proxy_set_header Host $host;
    }
}