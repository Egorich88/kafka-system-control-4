<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Верхний центральный узел -->
  <circle cx="200" cy="100" r="52" fill="none" stroke="white" stroke-width="12"/>
  <circle cx="200" cy="100" r="32" fill="white"/>

  <!-- Вертикальная линия вниз -->
  <line x1="200" y1="156" x2="200" y2="200" stroke="white" stroke-width="12" stroke-linecap="round"/>

  <!-- Горизонтальная линия -->
  <line x1="104" y1="200" x2="296" y2="200" stroke="white" stroke-width="12" stroke-linecap="round"/>

  <!-- Вертикальные линии от горизонтали к нижним узлам -->
  <line x1="104" y1="200" x2="104" y2="240" stroke="white" stroke-width="12" stroke-linecap="round"/>
  <line x1="200" y1="200" x2="200" y2="240" stroke="white" stroke-width="12" stroke-linecap="round"/>
  <line x1="296" y1="200" x2="296" y2="240" stroke="white" stroke-width="12" stroke-linecap="round"/>

  <!-- Три нижних узла (кольца) -->
  <circle cx="104" cy="272" r="28" fill="none" stroke="white" stroke-width="10"/>
  <circle cx="200" cy="272" r="28" fill="none" stroke="white" stroke-width="10"/>
  <circle cx="296" cy="272" r="28" fill="none" stroke="white" stroke-width="10"/>

  <!-- Короткие линии под узлами к точкам -->
  <line x1="104" y1="300" x2="104" y2="316" stroke="white" stroke-width="10" stroke-linecap="round"/>
  <line x1="200" y1="300" x2="200" y2="316" stroke="white" stroke-width="10" stroke-linecap="round"/>
  <line x1="296" y1="300" x2="296" y2="316" stroke="white" stroke-width="10" stroke-linecap="round"/>

  <!-- Статусные точки -->
  <circle cx="104" cy="336" r="8" fill="white"/>
  <circle cx="104" cy="360" r="8" fill="white"/>

  <circle cx="200" cy="328" r="8" fill="white"/>
  <circle cx="200" cy="348" r="8" fill="white"/>
  <circle cx="200" cy="368" r="8" fill="white"/>

  <circle cx="296" cy="336" r="8" fill="white"/>
  <circle cx="296" cy="360" r="8" fill="white"/>
</svg>