<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Верхний центральный узел -->
  <circle cx="50" cy="25" r="13" fill="none" stroke="white" stroke-width="3"/>
  <circle cx="50" cy="25" r="8" fill="white"/>

  <!-- Вертикальная линия вниз -->
  <line x1="50" y1="39" x2="50" y2="50" stroke="white" stroke-width="3" stroke-linecap="round"/>

  <!-- Горизонтальная линия -->
  <line x1="20" y1="50" x2="80" y2="50" stroke="white" stroke-width="3" stroke-linecap="round"/>

  <!-- Вертикальные линии от горизонтали к нижним узлам -->
  <line x1="20" y1="50" x2="20" y2="62" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="50" y2="62" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="80" y1="50" x2="80" y2="62" stroke="white" stroke-width="3" stroke-linecap="round"/>

  <!-- Три нижних узла (кольца) -->
  <circle cx="20" cy="70" r="7" fill="none" stroke="white" stroke-width="2.5"/>
  <circle cx="50" cy="70" r="7" fill="none" stroke="white" stroke-width="2.5"/>
  <circle cx="80" cy="70" r="7" fill="none" stroke="white" stroke-width="2.5"/>

  <!-- Статусные точки -->
  <circle cx="20" cy="82" r="2" fill="white"/>
  <circle cx="20" cy="89" r="2" fill="white"/>

  <circle cx="50" cy="82" r="2" fill="white"/>
  <circle cx="50" cy="89" r="2" fill="white"/>
  <circle cx="50" cy="96" r="2" fill="white"/>

  <circle cx="80" cy="82" r="2" fill="white"/>
  <circle cx="80" cy="89" r="2" fill="white"/>
</svg>